name: Stakia regression checks
on:
  push:
    branches: [codex/stakia-upgrade, codex/stakia-host-runtime]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stakia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-and-firmware-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: xinnan-tech/xiaozhi-esp32-server
          ref: 6afc54a17def47578a4b3efc4680873689d3168b
          path: .ci/xiaozhi-server
          persist-credentials: false
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8,<10' pytest-subtests 'PyYAML>=6,<7' 'cryptography>=46,<47' websockets==14.2
      - name: Host, real TLS, authentication, and patched upstream regressions
        env:
          STAKIA_SERVER_SOURCE: ${{ github.workspace }}/.ci/xiaozhi-server
        run: python -m pytest -q
      - name: Native firmware helper and eye geometry checks
        if: ${{ hashFiles('firmware/stakia/local-only-factory.patch') != '' }}
        run: |
          python -m unittest discover -s firmware/tests -p 'test_*.py'
          g++ -std=c++17 -Wall -Wextra -pedantic -Ifirmware/stakia firmware/tests/eye_geometry_test.cpp -o /tmp/stakia-eyes
          /tmp/stakia-eyes
      - uses: actions/checkout@v4
        if: ${{ hashFiles('firmware/stakia/local-only-factory.patch') != '' }}
        with:
          repository: m5stack/StackChan
          ref: 1b5765599fba8aaad1811d9a79358ccc7051f5f3
          path: .ci/factory
          persist-credentials: false
      - name: Prepare factory patches and TLS configuration twice
        if: ${{ hashFiles('firmware/stakia/local-only-factory.patch') != '' }}
        run: |
          python firmware/build_factory.py --source .ci/factory --server-host 192.168.1.20 --prepare-only --security-dir .ci/security
          python firmware/build_factory.py --source .ci/factory --server-host 192.168.1.20 --prepare-only --security-dir .ci/security
      - uses: actions/checkout@v4
        if: ${{ hashFiles('firmware/stakia/local-only-factory.patch') != '' }}
        with:
          repository: 78/xiaozhi-esp32
          ref: e77dedb1309153bb63fed285772962c920c97dd4
          path: .ci/xiaozhi-firmware
          persist-credentials: false
      - name: Check firmware protocol patch against pinned sources
        if: ${{ hashFiles('firmware/stakia/local-only-factory.patch') != '' }}
        run: |
          git -C .ci/xiaozhi-firmware apply ../factory/firmware/patches/xiaozhi-esp32.patch
          git -C .ci/xiaozhi-firmware apply ../../firmware/stakia/local-only-xiaozhi.patch
